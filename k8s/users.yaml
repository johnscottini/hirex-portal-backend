apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-service
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels: { app: users-service }
  template:
    metadata:
      labels: { app: users-service }
    spec:
      containers:
        - name: users-service
          image: jonathanscottini/users-service:dev
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef: { name: users-config }
            - secretRef:    { name: users-secret }
          env:
            - name: EUREKA_INSTANCE_PREFER_IP_ADDRESS
              value: "false"
            - name: EUREKA_INSTANCE_HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://$(DB_HOST):$(DB_PORT)/$(DB_NAME)"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom: { secretKeyRef: { name: users-secret, key: DB_USERNAME } }
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom: { secretKeyRef: { name: users-secret, key: DB_PASSWORD } }
---
apiVersion: v1
kind: Service
metadata:
  name: users-service
  namespace: dev
spec:
  selector: { app: users-service }
  ports:
    - name: http
      port: 8081
      targetPort: 8081
  type: ClusterIP
