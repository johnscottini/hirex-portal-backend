apiVersion: apps/v1
kind: Deployment
metadata:
  name: discovery
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels: { app: discovery }
  template:
    metadata:
      labels: { app: discovery }
    spec:
      containers:
        - name: discovery
          image: jonathanscottini/discovery:dev
          ports:
            - containerPort: 8761
          env:
            - name: SERVER_PORT
              value: "8761"
            - name: EUREKA_CLIENT_REGISTER_WITH_EUREKA
              value: "false"
            - name: EUREKA_CLIENT_FETCH_REGISTRY
              value: "false"
---
apiVersion: v1
kind: Service
metadata:
  name: discovery
  namespace: dev
spec:
  selector: { app: discovery }
  ports:
    - name: http
      port: 8761
      targetPort: 8761
  type: ClusterIP