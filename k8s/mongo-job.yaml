apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-job
  namespace: hirex
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo-job
  template:
    metadata:
      labels:
        app: mongo-job
    spec:
      containers:
        - name: mongo-job
          image: mongo:7
          ports:
            - containerPort: 27017

---
apiVersion: v1
kind: Service
metadata:
  name: mongo-job
  namespace: hirex
spec:
  selector:
    app: mongo-job
  ports:
    - port: 27017
      targetPort: 27017
