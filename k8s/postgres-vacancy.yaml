apiVersion: v1
kind: Secret
metadata:
  name: postgres-vacancy-secret
  namespace: hirex
type: Opaque
stringData:
  POSTGRES_PASSWORD: "123456"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-vacancy-config
  namespace: hirex
data:
  POSTGRES_DB: "vacancydb"
  POSTGRES_USER: "vacancy"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-vacancy
  namespace: hirex
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-vacancy
  template:
    metadata:
      labels:
        app: postgres-vacancy
    spec:
      containers:
        - name: postgres-vacancy
          image: postgres:16-alpine
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: postgres-vacancy-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: postgres-vacancy-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-vacancy-secret
                  key: POSTGRES_PASSWORD
          ports:
            - containerPort: 5432

---
apiVersion: v1
kind: Service
metadata:
  name: postgres-vacancy
  namespace: hirex
spec:
  selector:
    app: postgres-vacancy
  ports:
    - port: 5432
      targetPort: 5432
