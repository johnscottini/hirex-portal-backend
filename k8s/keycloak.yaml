apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: hirex
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:24.0.0
          args: ["start-dev", "--http-port=8081"]
          env:
            - name: KEYCLOAK_ADMIN
              value: "admin"
            - name: KEYCLOAK_ADMIN_PASSWORD
              value: "admin"
          ports:
            - containerPort: 8081

---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: hirex
spec:
  type: NodePort
  selector:
    app: keycloak
  ports:
    - port: 8081
      targetPort: 8081
      nodePort: 30081
