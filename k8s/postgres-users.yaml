apiVersion: v1
kind: Secret
metadata:
  name: postgres-users-secret
  namespace: hirex
type: Opaque
stringData:
  POSTGRES_PASSWORD: "123456"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-users-config
  namespace: hirex
data:
  POSTGRES_DB: "usersdb"
  POSTGRES_USER: "users"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-users
  namespace: hirex
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-users
  template:
    metadata:
      labels:
        app: postgres-users
    spec:
      containers:
        - name: postgres-users
          image: postgres:16-alpine
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: postgres-users-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: postgres-users-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-users-secret
                  key: POSTGRES_PASSWORD
          ports:
            - containerPort: 5432

---
apiVersion: v1
kind: Service
metadata:
  name: postgres-users
  namespace: hirex
spec:
  selector:
    app: postgres-users
  ports:
    - port: 5432
      targetPort: 5432
