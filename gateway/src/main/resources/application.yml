server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: users_route
          uri: lb://users-service
          predicates:
            - Path=/users/**
          filters:
            - StripPrefix=1
        - id: vacancy_route
          uri: lb://vacancy-service
          predicates:
            - Path=/vacancy/**
          filters:
            - StripPrefix=1
    discovery:
      locator:
        enabled: true

eureka:
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1
    hostname: localhost
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
